<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阪神タイガースログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Hanshin Tigers log</p>
            <h1 id="app-title">阪神タイガースログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="diary-form" class="diary-form">
          <label class="field-label" for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required />

          <fieldset class="result-field">
            <legend>今日の記録</legend>
            <div class="result-grid" id="result-grid">
              <label class="result-option">
                <input type="radio" name="result" value="win" required />
                <span class="result-icon">🐯</span>
                <span>勝ち</span>
              </label>
              <label class="result-option">
                <input type="radio" name="result" value="loss" />
                <span class="result-icon">😣</span>
                <span>負け</span>
              </label>
              <label class="result-option">
                <input type="radio" name="result" value="draw" />
                <span class="result-icon">🤝</span>
                <span>引き分け</span>
              </label>
              <label class="result-option">
                <input type="radio" name="result" value="no-game" />
                <span class="result-icon">⚾</span>
                <span>試合なし</span>
              </label>
              <label class="result-option">
                <input type="radio" name="result" value="cancelled" />
                <span class="result-icon">🌧️</span>
                <span>中止</span>
              </label>
            </div>
          </fieldset>

          <label class="field-label" for="entry-note">メモ</label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="160"
            placeholder="試合の感想や出来事をメモしよう"
            required
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の記録を書いています</span>
            <span><span id="char-count">0</span>/160</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">my game logs</p>
            <h2 id="history-title">過去ログ</h2>
          </div>
          <div class="stats-strip" aria-label="記録数">
            <strong id="entry-count">0</strong>
            <span>days</span>
          </div>
        </div>

        <div class="summary-row" id="summary-row" aria-label="試合結果の集計"></div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="メモから探す" />
          </label>
          <select id="result-filter" aria-label="試合結果で絞り込み">
            <option value="all">すべての結果</option>
            <option value="win">勝ち</option>
            <option value="loss">負け</option>
            <option value="draw">引き分け</option>
            <option value="no-game">試合なし</option>
            <option value="cancelled">中止</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだ記録がありません</strong>
          <span>今日の試合結果とメモを保存すると、ここに表示されます。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した試合ログ一覧"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
